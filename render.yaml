services:
  - type: web
    name: application-web-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: application-web-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

  - type: web
    name: application-web-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: application-web-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: "80"

databases:
  - name: application-web-db
    databaseName: cloudops_db
    user: application_web
    plan: free
    region: singapore
