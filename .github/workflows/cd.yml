name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Deploy backend to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          DEPLOY_REF: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Set the RENDER_BACKEND_DEPLOY_HOOK repository secret."
            exit 1
          fi
          curl --fail --show-error --silent --request POST "${RENDER_DEPLOY_HOOK}&ref=${DEPLOY_REF}"

      - name: Deploy frontend to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
          DEPLOY_REF: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Set the RENDER_FRONTEND_DEPLOY_HOOK repository secret."
            exit 1
          fi
          curl --fail --show-error --silent --request POST "${RENDER_DEPLOY_HOOK}&ref=${DEPLOY_REF}"
